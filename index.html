<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ATTAQ LAB - Interactive experience design studio." />
  <title>ATTAQ LAB</title>
  <style>
    @font-face {
      font-family: "Quantify";
      src: url("assets/fonts/Quantify-Bold-v2.6.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #050609;
      --text: #f5f7ef;
      --muted: #b3bdc8;
      --dim: #71808c;
      --cyan: #53e9ff;
      --magenta: #ff4fcb;
      --acid: #d7ff57;
      --line: rgba(236, 244, 255, 0.16);
      --display: "Quantify", Impact, Haettenschweiler, "Arial Black", sans-serif;
      --mono: "Quantify", "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Quantify", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(rgba(5, 6, 9, 0.58), rgba(5, 6, 9, 0.88)),
        radial-gradient(circle at 16% 4%, rgba(83, 233, 255, 0.13), transparent 28%),
        radial-gradient(circle at 88% 22%, rgba(255, 79, 203, 0.12), transparent 30%),
        url("images/mainpage-background.png") center / cover fixed,
        linear-gradient(180deg, #050609 0%, #090d12 52%, #050609 100%);
      font-family: var(--display);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 6px),
        linear-gradient(90deg, rgba(83,233,255,0.045), transparent 20%, transparent 80%, rgba(255,79,203,0.045));
      mix-blend-mode: screen;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at center, transparent 0 44%, rgba(0,0,0,0.48) 100%),
        linear-gradient(180deg, transparent 0 56%, rgba(0,0,0,0.42) 100%);
      pointer-events: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100% - 48px, 1180px);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 34px;
      padding: 54px 0 34px;
    }

    main {
      min-width: 0;
      display: grid;
      place-items: center;
    }

    .hero {
      width: 100%;
      display: grid;
      gap: clamp(28px, 5vw, 56px);
      place-items: center;
      text-align: center;
    }

    h1 {
      position: relative;
      margin: 0;
      color: var(--text);
      font-size: clamp(56px, 13vw, 178px);
      line-height: 0.86;
      letter-spacing: 0.03em;
      font-weight: 950;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow:
        4px 0 0 rgba(83,233,255,0.9),
        -4px 0 0 rgba(255,79,203,0.82),
        0 0 30px rgba(83,233,255,0.14);
      animation: logoPulse 4.8s infinite steps(1, end);
    }

    h1::before,
    h1::after {
      content: "ATTAQ LAB";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }

    h1::before {
      color: var(--cyan);
      transform: translateX(5px);
      clip-path: inset(12% 0 66% 0);
      animation: glitchCyan 4.2s infinite steps(1, end);
    }

    h1::after {
      color: var(--magenta);
      transform: translateX(-5px);
      clip-path: inset(58% 0 18% 0);
      animation: glitchMagenta 4.2s infinite steps(1, end);
    }

    .subtitle {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.85vw, 24px);
      line-height: 1.28;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .video-placeholder {
      width: min(100%, 760px);
      aspect-ratio: 16 / 9;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(83,233,255,0.08), transparent 38%),
        radial-gradient(circle at 82% 18%, rgba(255,79,203,0.11), transparent 30%),
        rgba(3, 5, 8, 0.68);
      box-shadow:
        0 28px 80px rgba(0,0,0,0.42),
        inset 0 0 36px rgba(255,255,255,0.018);
    }

    .video-placeholder::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(83,233,255,0.08), transparent 28%, transparent 72%, rgba(255,79,203,0.08)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 7px);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .video-placeholder::after {
      content: "";
      width: 72px;
      height: 72px;
      border: 1px solid rgba(83,233,255,0.34);
      background:
        linear-gradient(135deg, rgba(83,233,255,0.09), rgba(255,79,203,0.08)),
        rgba(5,8,11,0.74);
      box-shadow:
        3px 0 0 rgba(83,233,255,0.5),
        -3px 0 0 rgba(255,79,203,0.42),
        0 0 36px rgba(83,233,255,0.14);
      clip-path: polygon(34% 24%, 34% 76%, 78% 50%);
    }

    .video-label {
      position: absolute;
      left: 18px;
      top: 16px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    footer {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .linkedin {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border: 1px solid rgba(83,233,255,0.22);
      background: rgba(83,233,255,0.045);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .linkedin:hover {
      transform: translateY(-2px);
      border-color: rgba(83,233,255,0.52);
      background: rgba(83,233,255,0.095);
    }

    .linkedin svg {
      width: 18px;
      height: 18px;
      color: #7defff;
    }

    @keyframes logoPulse {
      0%, 88%, 100% { transform: translate(0, 0); }
      89% { transform: translate(1px, -1px); }
      90% { transform: translate(-2px, 1px); }
      91% { transform: translate(0, 0); }
    }

    @keyframes glitchCyan {
      0%, 84%, 100% { opacity: 0; transform: translateX(5px); }
      85%, 86% { opacity: .75; transform: translateX(8px); }
      88% { opacity: .45; transform: translateX(3px); }
    }

    @keyframes glitchMagenta {
      0%, 83%, 100% { opacity: 0; transform: translateX(-5px); }
      84%, 86% { opacity: .7; transform: translateX(-8px); }
      89% { opacity: .42; transform: translateX(-3px); }
    }

    @media (max-width: 760px) {
      .page {
        width: calc(100% - 32px);
        padding: 32px 0 24px;
      }

      h1 {
        font-size: clamp(42px, 16vw, 78px);
        white-space: normal;
      }

      .subtitle {
        margin-top: 14px;
      }

      .video-placeholder {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1,
      h1::before,
      h1::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <section class="hero" aria-label="ATTAQ LAB">
        <div>
          <h1>ATTAQ LAB</h1>
          <p class="subtitle">Interactive experience design studio</p>
        </div>

        <div class="video-placeholder" aria-label="Future video placeholder">
          <span class="video-label">Future video signal</span>
        </div>
      </section>
    </main>

    <footer>
      <a class="linkedin" href="https://www.linkedin.com/company/attaq-lab" target="_blank" rel="noreferrer" aria-label="ATTAQ LAB on LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.86-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.33V9h3.42v1.56h.05c.48-.9 1.64-1.86 3.37-1.86 3.6 0 4.27 2.37 4.27 5.46v6.29ZM5.31 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12Zm1.78 13.02H3.53V9h3.56v11.45ZM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0Z" />
        </svg>
        LinkedIn
      </a>
    </footer>
  </div>
</body>
</html>
